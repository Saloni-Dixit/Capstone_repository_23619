version: 2

models:
  - name: fact_sales

    columns:
      - name: sales_key
        tests:
          - not_null
          - unique

      - name: order_id
        tests:
          - not_null

      - name: customer_key
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_customers')
                field: customer_key

      - name: product_key
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_product')
                field: product_key

      - name: store_key
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_store')
                field: store_key

      - name: employee_key
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_employee')
                field: employee_key
              config:
                where: "employee_key is not null"


      - name: date_key
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_date')
                field: date_key

      - name: quantity_sold
        tests:
          - not_null

      - name: unit_price
        tests:
          - not_null

      - name: profit_amount
        tests:
          - not_null

      - name: sales_channel
        tests:
          - accepted_values:
              arguments:
                values:
                  - Online
                  - In-Store

      - name: order_status
        tests:
          - not_null

      - name: source_file
        tests:
          - not_null

      - name: load_timestamp
        tests:
          - not_null

tests:
  - dbt_utils.unique_combination_of_columns:
      arguments:
        combination_of_columns:
          - order_id
          - product_key