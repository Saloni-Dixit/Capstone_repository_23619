version: 2

models:
  - name: dim_date
    columns:
      - name: date_key
        tests:
          - unique
          - not_null

      - name: full_date
        tests:
          - unique
          - not_null

      - name: year
        tests:
          - not_null

      - name: quarter
        tests:
          - not_null

      - name: month
        tests:
          - not_null

      - name: week
        tests:
          - not_null

      - name: day_of_week
        tests:
          - not_null

      - name: season
        tests:
          - not_null

      - name: holiday_flag
        tests:
          - accepted_values:
              arguments:
                values:
                  - true
                  - false