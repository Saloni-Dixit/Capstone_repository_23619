version: 2

models:
  - name: silver_customer
    description: "Cleaned and transformed customer dimension table"

    columns:

      - name: customer_id
        tests:
          - unique
          - not_null

      - name: full_name
        tests:
          - not_null


      - name: customer_segment
        tests:
          - accepted_values:
              arguments:
                values:
                  - Young
                  - Middle-aged
                  - Senior
                  - Unknown

      - name: cleaned_email

      - name: email_status
        tests:
          - accepted_values:
              arguments:
                values:
                  - VALID
                  - INVALID

      - name: cleaned_phone

      - name: phone_status
        description: "Phone validation flag"
        tests:
          - accepted_values:
              arguments:
                values:
                  - VALID
                  - INVALID

      - name: loyalty_tier
        tests:
          - accepted_values:
              arguments:
                values:
                  - BRONZE
                  - SILVER
                  - GOLD
                  - PLATINUM

      - name: preferred_communication
        tests:
          - accepted_values:
              arguments:
                values:
                  - Email
                  - Phone
                  - Sms
                  - Mail

      - name: marketing_opt_in
        tests:
          - accepted_values:
              arguments:
                values:
                  - TRUE
                  - FALSE

      - name: total_purchases
        tests:
          - not_null

      - name: total_spend
        tests:
          - not_null